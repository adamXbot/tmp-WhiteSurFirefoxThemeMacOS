name: Focused open PR review
on:
  push:
    branches: [codex/pr-review-2026-10-01]
permissions:
  contents: read
jobs:
  review:
    name: Review (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: linux
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: AdamXweb/WhiteSurFirefoxThemeMacOS
          ref: 241669622c4c9008d9f212d41da669baf1de0758
          path: source-pr187
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: mortie/WhiteSurFirefoxThemeMacOS
          ref: cbe2a621fba5ce1e8d081e1c2cd50e7c99a1738a
          path: source-pr170
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: adamXbot/tmp-WhiteSurFirefoxThemeMacOS
          ref: 0948532948495d4feb0e718a47c5ca563b84fc3c
          path: source-pr194
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install fxcss
        run: python -m pip install --disable-pip-version-check "fxcss[images]==0.22.0"
      - name: Firefox 156.0.1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'firefox-setup.exe'
          Invoke-WebRequest -Uri 'https://archive.mozilla.org/pub/firefox/releases/156.0.1/win64/en-US/Firefox%20Setup%20156.0.1.exe' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          'FIREFOX_BIN=C:\Program Files\Mozilla Firefox\firefox.exe' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Firefox 156.0.1 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libdbus-glib-1-2 >/dev/null
          curl --fail --location --silent --show-error 'https://archive.mozilla.org/pub/firefox/releases/156.0.1/linux-x86_64/en-US/firefox-156.0.1.tar.xz' -o "$RUNNER_TEMP/firefox.tar.xz"
          tar -xf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP"
          echo "FIREFOX_BIN=$RUNNER_TEMP/firefox/firefox" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1600x1200x24 -nolisten tcp >/dev/null 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
      - name: Measure PR behavior
        run: python tools/review_open_prs.py --base . --pr187 source-pr187 --pr170 source-pr170 --pr194 source-pr194 --out review-results
      - name: Upload measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-${{ matrix.label }}
          path: review-results/
          retention-days: 14
          if-no-files-found: warn
